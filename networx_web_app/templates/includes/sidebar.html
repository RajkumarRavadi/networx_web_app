<aside id="mainSidebar"
    class="w-64 glass-panel flex-shrink-0 hidden md:flex flex-col h-full z-20 relative border-r border-white/10 transition-all duration-300 ease-in-out">
    <div class="p-6 flex items-center justify-between">
        <a href="/dashboard" class="flex items-center gap-3 group overflow-hidden whitespace-nowrap">
            <div
                class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-violet-500/20 group-hover:shadow-violet-500/40 transition-all flex-shrink-0">
                <span class="text-xl font-bold text-white">N</span>
            </div>
            <span class="text-xl font-bold tracking-tight sidebar-text transition-opacity duration-300"
                style="color: var(--text-main);">NETWORX</span>
        </a>
        <button id="sidebarToggle"
            class="p-1.5 rounded-lg hover:bg-white/5 text-gray-400 hover:text-white transition-colors absolute -right-3 top-8 bg-[#0f172a] border border-white/10 shadow-lg z-50">
            <i class="ri-arrow-left-s-line text-lg transition-transform duration-300" id="sidebarToggleIcon"></i>
        </button>
    </div>

    <nav class="flex-1 px-4 space-y-2 overflow-y-auto py-4 overflow-x-hidden">
        <p class="px-4 text-xs font-semibold uppercase tracking-wider mb-2 sidebar-text whitespace-nowrap transition-opacity duration-300"
            style="color: var(--text-muted);">Menu</p>

        <a href="/dashboard"
            class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg {{ 'active' if active_page == 'dashboard' else '' }} group relative">
            <i class="ri-dashboard-line text-xl flex-shrink-0"></i>
            <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Dashboard</span>
            <!-- Tooltip for collapsed state -->
            <div
                class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 hidden collapsed-tooltip">
                Dashboard
            </div>
        </a>
        <a href="/jobs"
            class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg {{ 'active' if active_page == 'jobs' else '' }} group relative">
            <i class="ri-briefcase-line text-xl flex-shrink-0"></i>
            <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Jobs</span>
            <div
                class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 hidden collapsed-tooltip">
                Jobs
            </div>
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg group relative">
            <i class="ri-calendar-event-line text-xl flex-shrink-0"></i>
            <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Events</span>
            <div
                class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 hidden collapsed-tooltip">
                Events
            </div>
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg group relative">
            <i class="ri-group-line text-xl flex-shrink-0"></i>
            <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Mentorship</span>
            <div
                class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 hidden collapsed-tooltip">
                Mentorship
            </div>
        </a>

        <p class="px-4 text-xs font-semibold uppercase tracking-wider mb-2 mt-6 sidebar-text whitespace-nowrap transition-opacity duration-300"
            style="color: var(--text-muted);">
            Personal</p>

        <a href="/myprofile"
            class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg {{ 'active' if active_page == 'profile' else '' }} group relative">
            <i class="ri-user-smile-line text-xl flex-shrink-0"></i>
            <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">My Profile</span>
            <div
                class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 hidden collapsed-tooltip">
                My Profile
            </div>
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg group relative">
            <i class="ri-file-list-3-line text-xl flex-shrink-0"></i>
            <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Applications</span>
            <div
                class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 hidden collapsed-tooltip">
                Applications
            </div>
        </a>
    </nav>

    <div class="p-4 border-t" style="border-color: var(--border-color);">
        <button id="themeToggleBtn"
            class="flex items-center gap-3 px-4 py-3 rounded-lg w-full transition-colors mb-2 sidebar-link group relative">
            <i class="ri-moon-line text-xl flex-shrink-0"></i>
            <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Dark Mode</span>
            <div
                class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 hidden collapsed-tooltip">
                Toggle Theme
            </div>
        </button>
        <button id="logoutBtn"
            class="flex items-center gap-3 px-4 py-3 rounded-lg w-full transition-colors sidebar-link hover:text-red-400 hover:bg-red-500/10 group relative">
            <i class="ri-logout-box-r-line text-xl flex-shrink-0"></i>
            <span class="sidebar-text whitespace-nowrap transition-opacity duration-300">Logout</span>
            <div
                class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-50 hidden collapsed-tooltip">
                Logout
            </div>
        </button>
    </div>
</aside>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebar = document.getElementById('mainSidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const toggleIcon = document.getElementById('sidebarToggleIcon');
        const sidebarTexts = document.querySelectorAll('.sidebar-text');
        const tooltips = document.querySelectorAll('.collapsed-tooltip');

        // Load state
        const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
        if (isCollapsed) {
            setCollapsed(true);
        }

        toggleBtn.addEventListener('click', () => {
            const collapsed = sidebar.classList.contains('w-20');
            setCollapsed(!collapsed);
        });

        // Logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    await frappe.call({
                        method: 'logout',
                        callback: () => window.location.href = '/login'
                    });
                } catch (error) {
                    console.error('Logout failed:', error);
                    // Fallback redirect even if call fails
                    window.location.href = '/login';
                }
            });
        }

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                toggleIcon.classList.add('rotate-180');

                sidebarTexts.forEach(el => {
                    el.classList.add('opacity-0', 'w-0', 'hidden');
                });

                tooltips.forEach(el => {
                    el.classList.remove('hidden');
                });

                localStorage.setItem('sidebar-collapsed', 'true');
            } else {
                sidebar.classList.add('w-64');
                sidebar.classList.remove('w-20');
                toggleIcon.classList.remove('rotate-180');

                sidebarTexts.forEach(el => {
                    el.classList.remove('opacity-0', 'w-0', 'hidden');
                });

                tooltips.forEach(el => {
                    el.classList.add('hidden');
                });

                localStorage.setItem('sidebar-collapsed', 'false');
            }
        }
    });
</script>
