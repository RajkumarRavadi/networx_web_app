<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Events - NETWORX</title>

	<!-- Tailwind -->
	<script src="https://cdn.tailwindcss.com"></script>

	<!-- Icons -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

	<!-- Custom Theme -->
	<link rel="stylesheet" href="/assets/networx_web_app/css/networx_theme.css">
</head>

<body class="flex h-screen overflow-hidden">

	<!-- Sidebar -->
	{% set active_page = 'events' %}
	{% include "networx_web_app/templates/includes/sidebar.html" %}

	<!-- Main Content -->
	<main class="flex-1 overflow-y-auto relative">
		<!-- Mobile Header -->
		<header class="md:hidden glass-panel sticky top-0 z-30 px-4 py-3 flex items-center justify-between border-b border-white/10">
			<span class="font-bold text-xl" style="color: var(--text-main);">NETWORX</span>
			<button onclick="toggleMobileSidebar()" class="p-2 rounded-lg hover:bg-white/5 transition-colors"
				style="color: var(--text-main);">
				<i class="ri-menu-line text-2xl"></i>
			</button>
		</header>

		<div class="p-4 sm:p-6 md:p-10 max-w-7xl mx-auto pb-20">

			<!-- Header -->
			<div class="mb-8">
				<h1 class="text-3xl font-bold mb-2" style="color: var(--text-main);">My Events</h1>
				<p class="text-lg" style="color: var(--text-muted);">Manage your event registrations</p>
			</div>

			<!-- Tabs -->
			<div class="mb-6 flex gap-2 border-b" style="border-color: var(--border-color);">
				<button class="tab-btn active px-6 py-3 font-medium border-b-2 transition-colors" 
					data-tab="upcoming" style="border-color: var(--primary); color: var(--primary);">
					Upcoming
				</button>
				<button class="tab-btn px-6 py-3 font-medium border-b-2 transition-colors" 
					data-tab="past" style="border-color: transparent; color: var(--text-muted);">
					Past
				</button>
				<button class="tab-btn px-6 py-3 font-medium border-b-2 transition-colors" 
					data-tab="waitlisted" style="border-color: transparent; color: var(--text-muted);">
					Waitlisted
				</button>
				<button class="tab-btn px-6 py-3 font-medium border-b-2 transition-colors" 
					data-tab="cancelled" style="border-color: transparent; color: var(--text-muted);">
					Cancelled
				</button>
			</div>

			<!-- Events List -->
			<div id="eventsList" class="space-y-4">
				<div class="flex justify-center py-12">
					<div class="loader"></div>
				</div>
			</div>

		</div>
	</main>

	<!-- Scripts -->
	<script>
		// Initialize frappe
		window.frappe = {
			session: {
				user: '{{ user }}',
				user_fullname: '{{ frappe.session.user_fullname }}'
			},
			call: function (opts) {
				const params = new URLSearchParams();
				if (opts.args) {
					for (const [key, value] of Object.entries(opts.args)) {
						if (value === null || value === undefined) continue;
						if (typeof value === 'object' && Object.keys(value).length === 0) continue;
						if (value === '') continue;
						if (typeof value === 'object') {
							params.append(key, JSON.stringify(value));
						} else {
							params.append(key, value);
						}
					}
				}
				const url = '/api/method/' + opts.method + (params.toString() ? '?' + params.toString() : '');
				return fetch(url, {
					method: 'GET',
					headers: { 'Accept': 'application/json' },
					credentials: 'same-origin'
				})
					.then(response => {
						if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
						return response.json();
					})
					.then(data => {
						if (opts.callback) opts.callback(data);
						return data;
					});
			}
		};
	</script>
	<script src="/assets/networx_web_app/js/api.js?v=4"></script>
	<script src="/assets/networx_web_app/js/theme_toggle.js"></script>

	<script>
		let currentTab = 'upcoming';

		// Load events
		const loadMyEvents = async (status = null) => {
			try {
				const result = await NetworkxAPI.getMyRegistrations(status);
				renderEvents(result);
			} catch (error) {
				console.error('Error loading events:', error);
				document.getElementById('eventsList').innerHTML = `
					<div class="text-center text-red-400 py-12">
						<i class="ri-error-warning-line text-4xl mb-2"></i>
						<p>Error loading events.</p>
						<p class="text-sm opacity-75 mt-1">${error.message || 'Unknown error'}</p>
					</div>
				`;
			}
		};

		// Render events
		const renderEvents = (registrations) => {
			const container = document.getElementById('eventsList');

			if (registrations.length === 0) {
				container.innerHTML = `
					<div class="glass-panel rounded-2xl p-12 text-center">
						<div class="text-6xl mb-4">📅</div>
						<h3 class="text-xl font-bold mb-2" style="color: var(--text-main);">No events found</h3>
						<p style="color: var(--text-muted);">You don't have any ${currentTab} events.</p>
						<a href="/events" class="mt-4 inline-block px-6 py-2 rounded-lg btn-primary text-sm font-medium">
							Browse Events
						</a>
					</div>
				`;
				return;
			}

			container.innerHTML = registrations.map(reg => {
				const event = reg.event;
				const eventDate = new Date(event.event_date);
				const formattedDate = eventDate.toLocaleDateString('en-US', {
					month: 'short',
					day: 'numeric',
					year: 'numeric'
				});
				const formattedTime = eventDate.toLocaleTimeString('en-US', {
					hour: 'numeric',
					minute: '2-digit'
				});

				let statusBadge = '';
				if (reg.registration_status === 'Confirmed') {
					statusBadge = '<span class="px-2 py-1 rounded text-xs font-medium bg-green-500/20 text-green-400">Confirmed</span>';
				} else if (reg.is_waitlisted) {
					statusBadge = `<span class="px-2 py-1 rounded text-xs font-medium bg-yellow-500/20 text-yellow-400">Waitlist #${reg.waitlist_position}</span>`;
				} else if (reg.registration_status === 'Pending') {
					statusBadge = '<span class="px-2 py-1 rounded text-xs font-medium bg-blue-500/20 text-blue-400">Pending</span>';
				}

				const bannerHtml = event.event_banner ? 
					`<img src="${event.event_banner}" alt="${event.event_name}" class="w-full h-48 object-cover rounded-t-xl">` : 
					`<div class="w-full h-48 bg-gradient-to-br from-violet-500/20 to-indigo-500/20 rounded-t-xl flex items-center justify-center">
						<i class="ri-calendar-event-line text-6xl opacity-50" style="color: var(--primary);"></i>
					</div>`;

				let actionsHtml = '';
				if (currentTab === 'upcoming') {
					actionsHtml = `
						<a href="/events/${event.name}" class="px-4 py-2 rounded-lg border hover:bg-white/5 transition-colors text-sm font-medium" style="border-color: var(--border-color); color: var(--text-main);">
							View Details
						</a>
						<button onclick="cancelRegistration('${reg.registration_id}')" class="px-4 py-2 rounded-lg border border-red-500/20 text-red-400 hover:bg-red-500/10 transition-colors text-sm font-medium">
							Cancel
						</button>
					`;
				} else if (currentTab === 'past') {
					actionsHtml = `
						<a href="/events/${event.name}" class="px-4 py-2 rounded-lg border hover:bg-white/5 transition-colors text-sm font-medium" style="border-color: var(--border-color); color: var(--text-main);">
							View Details
						</a>
						${event.resources && event.resources.length > 0 ? `
							<button onclick="showResources('${event.name}')" class="px-4 py-2 rounded-lg btn-primary text-sm font-medium">
								Download Resources
							</button>
						` : ''}
					`;
				} else {
					actionsHtml = `
						<a href="/events/${event.name}" class="px-4 py-2 rounded-lg border hover:bg-white/5 transition-colors text-sm font-medium" style="border-color: var(--border-color); color: var(--text-main);">
							View Details
						</a>
						<button onclick="cancelRegistration('${reg.registration_id}')" class="px-4 py-2 rounded-lg border border-red-500/20 text-red-400 hover:bg-red-500/10 transition-colors text-sm font-medium">
							Cancel
						</button>
					`;
				}

				return `
					<div class="glass-card rounded-xl overflow-hidden">
						${bannerHtml}
						<div class="p-6">
							<div class="flex items-start justify-between mb-4">
								<div class="flex-1">
									<div class="flex items-center gap-3 mb-2">
										<span class="px-2 py-1 rounded text-xs font-medium bg-violet-500/20 text-violet-400">${event.event_type || 'Event'}</span>
										${statusBadge}
									</div>
									<h3 class="text-xl font-bold mb-2" style="color: var(--text-main);">${event.event_name}</h3>
									<div class="space-y-2 text-sm mb-4" style="color: var(--text-muted);">
										<div class="flex items-center gap-2">
											<i class="ri-calendar-line"></i>
											<span>${formattedDate} at ${formattedTime}</span>
										</div>
										<div class="flex items-center gap-2">
											<i class="ri-map-pin-line"></i>
											<span>${event.location || 'TBA'}</span>
										</div>
										${reg.checked_in ? '<div class="flex items-center gap-2 text-green-400"><i class="ri-check-line"></i> Checked In</div>' : ''}
									</div>
								</div>
							</div>
							<div class="flex items-center gap-3 pt-4 border-t" style="border-color: var(--border-color);">
								${actionsHtml}
							</div>
						</div>
					</div>
				`;
			}).join('');
		};

		// Tab switching
		document.querySelectorAll('.tab-btn').forEach(btn => {
			btn.addEventListener('click', () => {
				// Update active tab
				document.querySelectorAll('.tab-btn').forEach(b => {
					b.classList.remove('active');
					b.style.borderColor = 'transparent';
					b.style.color = 'var(--text-muted)';
				});
				btn.classList.add('active');
				btn.style.borderColor = 'var(--primary)';
				btn.style.color = 'var(--primary)';

				// Load events for tab
				currentTab = btn.dataset.tab;
				let status = null;
				if (currentTab === 'upcoming') status = 'upcoming';
				else if (currentTab === 'past') status = 'past';
				else if (currentTab === 'waitlisted') status = 'waitlisted';
				else if (currentTab === 'cancelled') status = null; // All cancelled

				loadMyEvents(status);
			});
		});

		// Cancel registration
		window.cancelRegistration = async (registrationId) => {
			if (!confirm('Are you sure you want to cancel your registration?')) return;
			try {
				const result = await NetworkxAPI.cancelRegistration(registrationId);
				alert(result.message || 'Registration cancelled');
				loadMyEvents(currentTab === 'upcoming' ? 'upcoming' : currentTab === 'past' ? 'past' : currentTab === 'waitlisted' ? 'waitlisted' : null);
			} catch (error) {
				alert(error.message || 'Failed to cancel registration');
			}
		};

		// Show resources
		window.showResources = async (eventId) => {
			try {
				const result = await NetworkxAPI.getEventDetail(eventId);
				if (result.resources && result.resources.length > 0) {
					const resourcesHtml = result.resources.map(resource => {
						const link = resource.resource_url || (resource.resource_file ? `/files/${resource.resource_file}` : '#');
						return `
							<a href="${link}" target="_blank" class="block p-3 rounded-lg border hover:bg-white/5 transition-colors mb-2" style="border-color: var(--border-color);">
								<div class="flex items-center justify-between">
									<div>
										<div class="font-medium" style="color: var(--text-main);">${resource.resource_name}</div>
										<div class="text-xs" style="color: var(--text-muted);">${resource.resource_type}</div>
									</div>
									<i class="ri-download-line"></i>
								</div>
							</a>
						`;
					}).join('');
					
					// Simple modal (you can enhance this with a proper modal library)
					const modal = document.createElement('div');
					modal.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50';
					modal.innerHTML = `
						<div class="glass-panel rounded-xl p-6 max-w-md w-full mx-4">
							<div class="flex items-center justify-between mb-4">
								<h3 class="text-xl font-bold" style="color: var(--text-main);">Event Resources</h3>
								<button onclick="this.closest('.fixed').remove()" class="text-2xl" style="color: var(--text-muted);">&times;</button>
							</div>
							<div class="space-y-2">
								${resourcesHtml}
							</div>
						</div>
					`;
					document.body.appendChild(modal);
					modal.querySelector('button').addEventListener('click', () => modal.remove());
				} else {
					alert('No resources available for this event.');
				}
			} catch (error) {
				alert('Error loading resources: ' + (error.message || 'Unknown error'));
			}
		};

		// Initial load
		document.addEventListener('DOMContentLoaded', () => {
			loadMyEvents('upcoming');
		});
	</script>
</body>

</html>
