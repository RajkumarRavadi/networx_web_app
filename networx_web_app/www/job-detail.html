<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Job Details - NETWORX</title>
	<link rel="stylesheet" href="/assets/networx_web_app/css/networx.css">
	<style>
		.job-header {
			background-color: var(--card-background);
			border-bottom: 1px solid var(--border-color);
			padding: 2rem 0;
			margin-bottom: 2rem;
		}
		
		.job-header-content {
			display: flex;
			align-items: start;
			gap: 2rem;
		}
		
		.job-logo-large {
			width: 100px;
			height: 100px;
			border-radius: 0.75rem;
			object-fit: cover;
			background-color: var(--background);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2.5rem;
			font-weight: 700;
			color: var(--primary-color);
		}
		
		.job-info {
			flex: 1;
		}
		
		.job-actions {
			display: flex;
			gap: 1rem;
		}
		
		.job-meta {
			display: flex;
			flex-wrap: wrap;
			gap: 1rem;
			margin-top: 1rem;
			color: var(--text-secondary);
			font-size: 0.875rem;
		}
		
		.job-meta-item {
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}
		
		.content-section {
			margin-bottom: 2rem;
		}
		
		.content-section h2 {
			font-size: 1.5rem;
			font-weight: 600;
			margin-bottom: 1rem;
		}
		
		.modal {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5);
			z-index: 1000;
			align-items: center;
			justify-content: center;
		}
		
		.modal.active {
			display: flex;
		}
		
		.modal-content {
			background-color: white;
			border-radius: 1rem;
			padding: 2rem;
			max-width: 600px;
			width: 90%;
			max-height: 80vh;
			overflow-y: auto;
		}
		
		.modal-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 1.5rem;
		}
		
		.modal-title {
			font-size: 1.5rem;
			font-weight: 600;
		}
		
		.close-btn {
			font-size: 1.5rem;
			cursor: pointer;
			color: var(--text-secondary);
			border: none;
			background: none;
			padding: 0;
			width: 2rem;
			height: 2rem;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		
		.close-btn:hover {
			color: var(--text-primary);
		}
	</style>
</head>
<body>
	<!-- Navbar -->
	<nav class="navbar">
		<div class="container navbar-content">
			<a href="/dashboard" class="navbar-brand">NETWORX</a>
			<ul class="navbar-nav">
				<li><a href="/dashboard">Dashboard</a></li>
				<li><a href="/jobs">Jobs</a></li>
				<li><a href="#" id="logoutBtn">Logout</a></li>
			</ul>
		</div>
	</nav>
	
	<!-- Job Header -->
	<div class="job-header">
		<div class="container">
			<div id="jobHeaderContent">
				<div class="loading">Loading job details...</div>
			</div>
		</div>
	</div>
	
	<!-- Main Content -->
	<main style="padding-bottom: 3rem;">
		<div class="container">
			<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
				<!-- Job Details -->
				<div>
					<div id="jobDescription" class="content-section">
					</div>
					
					<div id="jobRequirements" class="content-section">
					</div>
				</div>
				
				<!-- Sidebar -->
				<div>
					<div class="card">
						<h3 class="card-title">Job Information</h3>
						<div id="jobSidebar" style="margin-top: 1rem;">
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	
	<!-- Application Modal -->
	<div id="applicationModal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<h3 class="modal-title">Apply for this Job</h3>
				<button class="close-btn" onclick="closeApplicationModal()">×</button>
			</div>
			<form id="applicationForm">
				<div class="form-group">
					<label class="form-label" for="coverLetter">Cover Letter</label>
					<textarea 
						id="coverLetter" 
						name="cover_letter" 
						class="form-control" 
						rows="8"
						placeholder="Tell us why you're a great fit for this role..."
						style="resize: vertical;"
					></textarea>
				</div>
				<div style="display: flex; gap: 1rem; justify-content: flex-end;">
					<button type="button" class="btn btn-secondary" onclick="closeApplicationModal()">
						Cancel
					</button>
					<button type="submit" class="btn btn-primary">
						Submit Application
					</button>
				</div>
			</form>
		</div>
	</div>
	
	<script>
		// Simple frappe.call implementation using GET
		window.frappe = {
			call: function(opts) {
				// Build query parameters for GET request
				const params = new URLSearchParams();
				
				// Add all args as query parameters
				if (opts.args) {
					for (const [key, value] of Object.entries(opts.args)) {
						// Skip null, undefined, and empty objects
						if (value === null || value === undefined) continue;
						
						// Skip empty objects and empty strings
						if (typeof value === 'object' && Object.keys(value).length === 0) continue;
						if (value === '') continue;
						
						// Add the parameter
						if (typeof value === 'object') {
							params.append(key, JSON.stringify(value));
						} else {
							params.append(key, value);
						}
					}
				}
				
				// Build URL with query parameters
				const url = '/api/method/' + opts.method + (params.toString() ? '?' + params.toString() : '');
				
				return fetch(url, {
					method: 'GET',
					headers: {
						'Accept': 'application/json'
					},
					credentials: 'same-origin'
				})
				.then(response => {
					if (!response.ok) {
						return response.json().then(err => {
							console.error('Server error:', err);
							throw new Error(err.exception || `HTTP error! status: ${response.status}`);
						}).catch(() => {
							throw new Error(`HTTP error! status: ${response.status}`);
						});
					}
					return response.json();
				})
				.then(data => {
					if (opts.callback) opts.callback(data);
					return data;
				})
				.catch(error => {
					console.error('API Error:', error);
					if (opts.error) opts.error(error);
					throw error;
				});
			}
		};
	</script>
	<script src="/assets/networx_web_app/js/utils.js"></script>
	<script src="/assets/networx_web_app/js/api.js"></script>
	<script>
		// Get job ID from URL parameters
		const urlParams = new URLSearchParams(window.location.search);
		const jobId = urlParams.get('id');
		
		if (!jobId) {
			document.getElementById('jobHeaderContent').innerHTML = '<div class="error">Job ID is required</div>';
			throw new Error('Job ID is required');
		}
		
		let jobData = null;
		let hasApplied = false;
		
		// Logout handler
		document.getElementById('logoutBtn').addEventListener('click', async (e) => {
			e.preventDefault();
			await frappe.call({
				method: 'logout',
				callback: () => {
					window.location.href = '/login';
				}
			});
		});
		
		// Load job details
		const loadJobDetails = async () => {
			try {
				const result = await NetworkxAPI.getJobDetail(jobId);
				jobData = result.job;
				hasApplied = result.has_applied;
				
				NetworkxUtils.setPageTitle(jobData.job_title);
				
				// Render job header
				renderJobHeader();
				
				// Render job description
				renderJobDescription();
				
				// Render job requirements
				renderJobRequirements();
				
				// Render sidebar
				renderSidebar();
			} catch (error) {
				console.error('Error loading job details:', error);
				document.getElementById('jobHeaderContent').innerHTML = 
					'<div class="error">Error loading job details. Please try again.</div>';
			}
		};
		
		// Render job header
		const renderJobHeader = () => {
			const headerContent = document.getElementById('jobHeaderContent');
			
			const logoHTML = jobData.company_logo ? 
				`<img src="${jobData.company_logo}" alt="${jobData.company_name}" class="job-logo-large">` : 
				`<div class="job-logo-large">${jobData.company_name.charAt(0)}</div>`;
			
			headerContent.innerHTML = `
				<div class="job-header-content">
					${logoHTML}
					<div class="job-info">
						<h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">
							${jobData.job_title}
						</h1>
						<div style="font-size: 1.125rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
							${jobData.company_name}
						</div>
						<div class="job-meta">
							<div class="job-meta-item">
								<span>📍</span>
								<span>${jobData.location || 'Remote'}</span>
							</div>
							<div class="job-meta-item">
								<span>💼</span>
								<span>${jobData.job_type || 'Full-time'}</span>
							</div>
							<div class="job-meta-item">
								<span>📅</span>
								<span>Posted ${NetworkxUtils.formatDate(jobData.posted_date)}</span>
							</div>
							${jobData.salary_range ? `
								<div class="job-meta-item">
									<span>💰</span>
									<span>${jobData.salary_range}</span>
								</div>
							` : ''}
							${jobData.is_external_listing ? `
								<div class="job-meta-item">
									<span style="background: #F59E0B; color: white; padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600;">
										🔗 External Listing
									</span>
								</div>
							` : ''}
						</div>
					</div>
					<div class="job-actions">
						<button onclick="window.location.href='/jobs'" class="btn btn-secondary">
							← Back to Jobs
						</button>
						${jobData.is_external_listing ? 
							`<a href="${jobData.source_url || '#'}" target="_blank" class="btn btn-primary" style="text-decoration: none;">
								Apply on External Site →
							</a>` :
							hasApplied ? 
								`<button class="btn btn-secondary" disabled>Already Applied</button>` :
								`<button onclick="openApplicationModal()" class="btn btn-primary">Apply Now</button>`
						}
					</div>
				</div>
			`;
		};
		
		// Render job description
		const renderJobDescription = () => {
			const descriptionContainer = document.getElementById('jobDescription');
			descriptionContainer.innerHTML = `
				<h2>About the Role</h2>
				<div style="color: var(--text-secondary); line-height: 1.7;">
					${jobData.description || '<p>No description available.</p>'}
				</div>
			`;
		};
		
		// Render job requirements
		const renderJobRequirements = () => {
			const requirementsContainer = document.getElementById('jobRequirements');
			requirementsContainer.innerHTML = `
				<h2>Requirements</h2>
				<div style="color: var(--text-secondary); line-height: 1.7;">
					${jobData.requirements || '<p>No specific requirements listed.</p>'}
				</div>
			`;
		};
		
		// Render sidebar
		const renderSidebar = () => {
			const sidebarContainer = document.getElementById('jobSidebar');
			
			const items = [];
			
			if (jobData.experience_required) {
				items.push(`
					<div style="padding: 0.75rem 0; border-bottom: 1px solid var(--border-color);">
						<div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.25rem;">
							Experience Required
						</div>
						<div style="font-weight: 500;">
							${jobData.experience_required}
						</div>
					</div>
				`);
			}
			
			if (jobData.application_deadline) {
				items.push(`
					<div style="padding: 0.75rem 0; border-bottom: 1px solid var(--border-color);">
						<div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.25rem;">
							Application Deadline
						</div>
						<div style="font-weight: 500;">
							${NetworkxUtils.formatDate(jobData.application_deadline)}
						</div>
					</div>
				`);
			}
			
			items.push(`
				<div style="padding: 0.75rem 0;">
					<div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.25rem;">
						Status
					</div>
					<div style="font-weight: 500; color: var(--secondary-color);">
						${jobData.status}
					</div>
				</div>
			`);
			
			sidebarContainer.innerHTML = items.join('');
		};
		
		// Open application modal
		const openApplicationModal = () => {
			document.getElementById('applicationModal').classList.add('active');
		};
		
		// Close application modal
		const closeApplicationModal = () => {
			document.getElementById('applicationModal').classList.remove('active');
			document.getElementById('applicationForm').reset();
		};
		
		// Make functions global
		window.openApplicationModal = openApplicationModal;
		window.closeApplicationModal = closeApplicationModal;
		
		// Handle application submission
		document.getElementById('applicationForm').addEventListener('submit', async (e) => {
			e.preventDefault();
			
			const coverLetter = document.getElementById('coverLetter').value;
			const submitBtn = e.target.querySelector('button[type="submit"]');
			
			submitBtn.disabled = true;
			submitBtn.textContent = 'Submitting...';
			
			try {
				await NetworkxAPI.applyForJob(jobId, coverLetter);
				
				NetworkxUtils.showToast('Application submitted successfully!', 'success');
				closeApplicationModal();
				hasApplied = true;
				renderJobHeader();
			} catch (error) {
				console.error('Error submitting application:', error);
				NetworkxUtils.showToast('Error submitting application. Please try again.', 'error');
			} finally {
				submitBtn.disabled = false;
				submitBtn.textContent = 'Submit Application';
			}
		});
		
		// Close modal on outside click
		document.getElementById('applicationModal').addEventListener('click', (e) => {
			if (e.target.id === 'applicationModal') {
				closeApplicationModal();
			}
		});
		
		// Initialize
		document.addEventListener('DOMContentLoaded', () => {
			loadJobDetails();
		});
	</script>
</body>
</html>
