<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Job Openings - NETWORX</title>
	<link rel="stylesheet" href="/assets/networx_web_app/css/networx.css">
</head>
<body>
	<!-- Navbar -->
	<nav class="navbar">
		<div class="container navbar-content">
			<a href="/dashboard" class="navbar-brand">NETWORX</a>
			<ul class="navbar-nav">
				<li><a href="/dashboard">Dashboard</a></li>
				<li><a href="/jobs">Jobs</a></li>
				<li><a href="/myprofile">My Profile</a></li>
				<li><a href="#" id="logoutBtn">Logout</a></li>
			</ul>
		</div>
	</nav>
	
	<!-- Main Content -->
	<main style="padding: 2rem 0;">
		<div class="container">
			<h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">
				Job Openings
			</h1>
			<p style="color: var(--text-secondary); margin-bottom: 2rem;">
				Find your dream job from top companies
			</p>
			
			<!-- Filters -->
			<div class="card mb-3">
				<div class="grid grid-cols-4">
					<div class="form-group">
						<label class="form-label" for="searchInput">Search</label>
						<input 
							type="text" 
							id="searchInput" 
							class="form-control" 
							placeholder="Job title, company, location..."
						>
					</div>
					<div class="form-group">
						<label class="form-label" for="jobTypeFilter">Job Type</label>
						<select id="jobTypeFilter" class="form-control">
							<option value="">All Types</option>
							<option value="Internship">Internship</option>
							<option value="Full-time">Full-time</option>
							<option value="Part-time">Part-time</option>
						</select>
					</div>
					<div class="form-group">
						<label class="form-label" for="locationFilter">Location</label>
						<input 
							type="text" 
							id="locationFilter" 
							class="form-control" 
							placeholder="City or Remote"
						>
					</div>
					<div class="form-group" style="display: flex; align-items: flex-end;">
						<button id="applyFiltersBtn" class="btn btn-primary" style="width: 100%;">
							Apply Filters
						</button>
					</div>
				</div>
			</div>
			
			<!-- Results Info -->
			<div style="margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 0.875rem;">
				<span id="resultsInfo">Loading jobs...</span>
			</div>
			
			<!-- Jobs Grid -->
			<div id="jobsGrid" class="grid grid-cols-3">
				<div class="loading">Loading jobs...</div>
			</div>
			
			<!-- Pagination -->
			<div id="paginationContainer" style="display: flex; justify-content: center; margin-top: 2rem; gap: 0.5rem;">
			</div>
		</div>
	</main>
	
	<script>
		// Simple frappe.call implementation
		window.frappe = {
			call: function(opts) {
				// Build query parameters for GET request
				const params = new URLSearchParams();
				
				// Add all args as query parameters
				if (opts.args) {
					for (const [key, value] of Object.entries(opts.args)) {
						// Skip null, undefined, and empty objects
						if (value === null || value === undefined) continue;
						
						// Skip empty objects and empty strings
						if (typeof value === 'object' && Object.keys(value).length === 0) continue;
						if (value === '') continue;
						
						// Add the parameter
						if (typeof value === 'object') {
							params.append(key, JSON.stringify(value));
						} else {
							params.append(key, value);
						}
					}
				}
				
				// Build URL with query parameters
				const url = '/api/method/' + opts.method + (params.toString() ? '?' + params.toString() : '');
				
				return fetch(url, {
					method: 'GET',
					headers: {
						'Accept': 'application/json'
					},
					credentials: 'same-origin'
				})
				.then(response => {
					if (!response.ok) {
						return response.json().then(err => {
							console.error('Server error:', err);
							throw new Error(err.exception || `HTTP error! status: ${response.status}`);
						}).catch(() => {
							throw new Error(`HTTP error! status: ${response.status}`);
						});
					}
					return response.json();
				})
				.then(data => {
					if (opts.callback) opts.callback(data);
					return data;
				})
				.catch(error => {
					console.error('API Error:', error);
					if (opts.error) opts.error(error);
					throw error;
				});
			}
		};
	</script>
	<script src="/assets/networx_web_app/js/utils.js"></script>
	<script src="/assets/networx_web_app/js/api.js"></script>
	<script>
		NetworkxUtils.setPageTitle('Job Openings');
		
		// State
		let currentPage = 0;
		const jobsPerPage = 12;
		let totalJobs = 0;
		let currentFilters = {};
		let currentSearchTerm = null;
		
		// Logout handler
		document.getElementById('logoutBtn').addEventListener('click', async (e) => {
			e.preventDefault();
			await frappe.call({
				method: 'logout',
				callback: () => {
					window.location.href = '/login';
				}
			});
		});
		
		// Load jobs
		const loadJobs = async (page = 0) => {
			try {
				currentPage = page;
				const offset = page * jobsPerPage;
				
				const result = await NetworkxAPI.getJobListings(
					currentFilters,
					jobsPerPage,
					offset,
					currentSearchTerm
				);
				
				totalJobs = result.total_count;
				
				// Update results info
				const start = offset + 1;
				const end = Math.min(offset + jobsPerPage, totalJobs);
				document.getElementById('resultsInfo').textContent = 
					`Showing ${start}-${end} of ${totalJobs} jobs`;
				
				// Render jobs
				renderJobs(result.jobs);
				
				// Render pagination
				renderPagination();
			} catch (error) {
				console.error('Error loading jobs:', error);
				document.getElementById('jobsGrid').innerHTML = 
					'<div class="error">Error loading jobs. Please try again.</div>';
			}
		};
		
		// Render jobs
		const renderJobs = (jobs) => {
			const jobsGrid = document.getElementById('jobsGrid');
			
			if (jobs.length === 0) {
				jobsGrid.innerHTML = `
					<div class="empty-state" style="grid-column: 1 / -1;">
						<div class="empty-state-icon">💼</div>
						<div>No jobs found matching your criteria</div>
					</div>
				`;
				return;
			}
			
			jobsGrid.innerHTML = jobs.map(job => `
				<div class="card job-card" onclick="window.location.href='/job-detail?id=${job.name}'">
					<div class="job-card-header">
						${job.company_logo ? 
							`<img src="${job.company_logo}" alt="${job.company_name}" class="job-logo">` : 
							`<div class="job-logo" style="display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary-color);">${job.company_name.charAt(0)}</div>`
						}
						<div style="flex: 1;">
							<h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 0.25rem;">
								${job.job_title}
							</h3>
							<div style="color: var(--text-secondary); font-size: 0.875rem;">
								${job.company_name}
							</div>
						</div>
					</div>
					<div style="margin-bottom: 1rem;">
						<span class="job-badge">${job.job_type || 'Full-time'}</span>
						<span class="job-badge">${job.location || 'Remote'}</span>
						${job.is_external_listing ? '<span class="job-badge" style="background: #F59E0B; color: white;">🔗 External</span>' : ''}
					</div>
					<div style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1rem;">
						${job.experience_required || 'Fresher'}
					</div>
					<div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem;">
						<span style="color: var(--text-secondary);">
							Posted ${NetworkxUtils.formatDate(job.posted_date)}
						</span>
						<span style="color: var(--primary-color); font-weight: 500;">
							View Details →
						</span>
					</div>
				</div>
			`).join('');
		};
		
		// Render pagination
		const renderPagination = () => {
			const paginationContainer = document.getElementById('paginationContainer');
			const totalPages = Math.ceil(totalJobs / jobsPerPage);
			
			if (totalPages <= 1) {
				paginationContainer.innerHTML = '';
				return;
			}
			
			let paginationHTML = '';
			
			// Previous button
			if (currentPage > 0) {
				paginationHTML += `
					<button class="btn btn-secondary" onclick="loadJobs(${currentPage - 1})">
						← Previous
					</button>
				`;
			}
			
			// Page numbers (show max 5 pages)
			const startPage = Math.max(0, currentPage - 2);
			const endPage = Math.min(totalPages - 1, currentPage + 2);
			
			for (let i = startPage; i <= endPage; i++) {
				if (i === currentPage) {
					paginationHTML += `
						<button class="btn btn-primary" disabled>
							${i + 1}
						</button>
					`;
				} else {
					paginationHTML += `
						<button class="btn btn-secondary" onclick="loadJobs(${i})">
							${i + 1}
						</button>
					`;
				}
			}
			
			// Next button
			if (currentPage < totalPages - 1) {
				paginationHTML += `
					<button class="btn btn-secondary" onclick="loadJobs(${currentPage + 1})">
						Next →
					</button>
				`;
			}
			
			paginationContainer.innerHTML = paginationHTML;
		};
		
		// Apply filters
		const applyFilters = () => {
			const searchInput = document.getElementById('searchInput').value.trim();
			const jobType = document.getElementById('jobTypeFilter').value;
			const location = document.getElementById('locationFilter').value.trim();
			
			currentFilters = {};
			currentSearchTerm = searchInput || null;
			
			if (jobType) {
				currentFilters.job_type = jobType;
			}
			
			if (location) {
				currentFilters.location = location;
			}
			
			loadJobs(0);
		};
		
		// Event listeners
		document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
		
		// Search on enter
		document.getElementById('searchInput').addEventListener('keypress', (e) => {
			if (e.key === 'Enter') {
				applyFilters();
			}
		});
		
		// Make loadJobs globally accessible for pagination
		window.loadJobs = loadJobs;
		
		// Initialize
		document.addEventListener('DOMContentLoaded', () => {
			loadJobs(0);
		});
	</script>
</body>
</html>
