<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Job Openings - NETWORX</title>

	<!-- Tailwind -->
	<script src="https://cdn.tailwindcss.com"></script>

	<!-- Icons -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

	<!-- Custom Theme -->
	<link rel="stylesheet" href="/assets/networx_web_app/css/networx_theme.css">

	<script>
		(function () {
			const savedTheme = localStorage.getItem('networx-theme');
			const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
				document.documentElement.setAttribute('data-theme', 'dark');
			} else {
				document.documentElement.setAttribute('data-theme', 'light');
			}
		})();
	</script>
</head>

<body class="flex h-screen overflow-hidden">

	<!-- Sidebar -->
	{% set active_page = 'jobs' %}
	{% include "networx_web_app/templates/includes/sidebar.html" %}

	<!-- Main Content -->
	<main class="flex-1 overflow-y-auto relative">
		<!-- Mobile Header -->
		<header class="md:hidden glass-panel sticky top-0 z-30 px-4 py-3 flex items-center justify-between">
			<a href="/dashboard" class="font-bold text-xl" style="color: var(--text-main);">NETWORX</a>
			<button class="p-2" style="color: var(--text-main);">
				<i class="ri-menu-line text-2xl"></i>
			</button>
		</header>

		<div class="p-6 md:p-10 max-w-7xl mx-auto pb-20">

			<!-- Header -->
			<div class="mb-8">
				<h1 class="text-3xl font-bold mb-2" style="color: var(--text-main);">Job Openings</h1>
				<p class="text-lg" style="color: var(--text-muted);">Find your dream job from top companies</p>
			</div>

			<!-- Filters -->
			<div class="glass-panel rounded-2xl p-6 mb-8">
				<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
					<div class="form-group">
						<label class="block text-sm font-medium mb-2" style="color: var(--text-main);">Search</label>
						<div class="relative">
							<i class="ri-search-line absolute left-3 top-3 text-gray-400"></i>
							<input type="text" id="searchInput" class="w-full pl-10 pr-4 py-2 rounded-lg form-input"
								placeholder="Job title, company...">
						</div>
					</div>
					<div class="form-group">
						<label class="block text-sm font-medium mb-2" style="color: var(--text-main);">Job Type</label>
						<select id="jobTypeFilter" class="w-full px-4 py-2 rounded-lg form-input">
							<option value="">All Types</option>
							<option value="Internship">Internship</option>
							<option value="Full-time">Full-time</option>
							<option value="Part-time">Part-time</option>
						</select>
					</div>
					<div class="form-group">
						<label class="block text-sm font-medium mb-2" style="color: var(--text-main);">Location</label>
						<div class="relative">
							<i class="ri-map-pin-line absolute left-3 top-3 text-gray-400"></i>
							<input type="text" id="locationFilter" class="w-full pl-10 pr-4 py-2 rounded-lg form-input"
								placeholder="City or Remote">
						</div>
					</div>
					<div class="form-group flex items-end">
						<button id="applyFiltersBtn" class="w-full py-2 rounded-lg btn-primary font-medium">
							Apply Filters
						</button>
					</div>
				</div>
			</div>

			<!-- Results Info -->
			<div class="mb-6 text-sm" style="color: var(--text-muted);">
				<span id="resultsInfo">Loading jobs...</span>
			</div>

			<!-- Jobs Grid -->
			<div id="jobsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
				<!-- Loading State -->
				<div class="col-span-full flex justify-center py-12">
					<div class="loader"></div>
				</div>
			</div>

			<!-- Pagination -->
			<div id="paginationContainer" class="flex justify-center mt-10 gap-2"></div>

		</div>
	</main>

	<!-- Scripts -->
	<script>
		// Simple frappe.call implementation
		window.frappe = {
			call: function (opts) {
				const params = new URLSearchParams();
				if (opts.args) {
					for (const [key, value] of Object.entries(opts.args)) {
						if (value === null || value === undefined) continue;
						if (typeof value === 'object' && Object.keys(value).length === 0) continue;
						if (value === '') continue;
						if (typeof value === 'object') {
							params.append(key, JSON.stringify(value));
						} else {
							params.append(key, value);
						}
					}
				}
				const url = '/api/method/' + opts.method + (params.toString() ? '?' + params.toString() : '');
				return fetch(url, {
					method: 'GET',
					headers: { 'Accept': 'application/json' },
					credentials: 'same-origin'
				})
					.then(response => {
						if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
						return response.json();
					})
					.then(data => {
						if (opts.callback) opts.callback(data);
						return data;
					});
			}
		};
	</script>
	<script src="/assets/networx_web_app/js/utils.js"></script>
	<script src="/assets/networx_web_app/js/api.js?v=4"></script>
	<script src="/assets/networx_web_app/js/theme_toggle.js"></script>

	<script>
		// State
		let currentPage = 0;
		const jobsPerPage = 12;
		let totalJobs = 0;
		let currentFilters = {};
		let currentSearchTerm = null;

		// Logout handler
		document.getElementById('logoutBtn').addEventListener('click', async (e) => {
			e.preventDefault();
			await frappe.call({
				method: 'logout',
				callback: () => {
					window.location.href = '/login';
				}
			});
		});

		// Load jobs
		const loadJobs = async (page = 0) => {
			try {
				currentPage = page;
				const offset = page * jobsPerPage;

				const result = await NetworkxAPI.getJobListings(
					currentFilters,
					jobsPerPage,
					offset,
					currentSearchTerm
				);

				totalJobs = result.total_count;

				// Update results info
				const start = offset + 1;
				const end = Math.min(offset + jobsPerPage, totalJobs);
				document.getElementById('resultsInfo').textContent =
					`Showing ${start}-${end} of ${totalJobs} jobs`;

				// Render jobs
				renderJobs(result.jobs);

				// Render pagination
				renderPagination();
			} catch (error) {
				console.error('Error loading jobs:', error);
				document.getElementById('jobsGrid').innerHTML = `
                    <div class="col-span-full text-center text-red-400 py-12">
                        <i class="ri-error-warning-line text-4xl mb-2"></i>
                        <p>Error loading jobs.</p>
                        <p class="text-sm opacity-75 mt-1">${error.message || 'Unknown error'}</p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-colors text-sm">
                            Try Again
                        </button>
                    </div>
                `;
			}
		};

		// Render jobs
		const renderJobs = (jobs) => {
			const jobsGrid = document.getElementById('jobsGrid');

			if (jobs.length === 0) {
				jobsGrid.innerHTML = `
                    <div class="col-span-full glass-panel rounded-2xl p-12 text-center">
                        <div class="text-6xl mb-4">💼</div>
                        <h3 class="text-xl font-bold mb-2" style="color: var(--text-main);">No jobs found</h3>
                        <p style="color: var(--text-muted);">Try adjusting your search or filters</p>
                    </div>
                `;
				return;
			}

			jobsGrid.innerHTML = jobs.map(job => {
				const logoHtml = job.company_logo ?
					`<img src="${job.company_logo}" alt="${job.company_name}" class="w-12 h-12 rounded-lg object-cover bg-white">` :
					`<div class="w-12 h-12 rounded-lg flex items-center justify-center text-xl font-bold" style="background: var(--bg-body); color: var(--primary);">${job.company_name.charAt(0)}</div>`;

				return `
                <div class="glass-card rounded-xl p-6 relative overflow-hidden flex flex-col">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-4">
                            ${logoHtml}
                            <div>
                                <h3 class="font-bold text-lg leading-tight mb-1" style="color: var(--text-main);">${job.job_title}</h3>
                                <div class="text-sm font-medium" style="color: var(--text-muted);">${job.company_name}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="space-y-3 mb-6">
                        <div class="flex items-center gap-2 text-sm" style="color: var(--text-muted);">
                            <i class="ri-map-pin-line text-emerald-400"></i> ${job.location || 'Remote'}
                        </div>
                        <div class="flex items-center gap-2 text-sm" style="color: var(--text-muted);">
                            <i class="ri-briefcase-line text-violet-400"></i> ${job.job_type || 'Full-time'}
                        </div>
                        <div class="flex items-center gap-2 text-sm" style="color: var(--text-muted);">
                            <i class="ri-money-dollar-circle-line text-green-400"></i> ${job.salary_range || 'Not disclosed'}
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-auto pt-4 border-t" style="border-color: var(--border-color);">
                        <span class="text-xs font-medium" style="color: var(--text-muted);">
                            Posted ${NetworkxUtils.formatDate(job.posted_date)}
                        </span>
                        <a href="/job_detail?id=${job.name}" class="text-sm font-bold hover:underline" style="color: var(--primary);">
                            View Details <i class="ri-arrow-right-line ml-1"></i>
                        </a>
                    </div>
                </div>
                `;
			}).join('');
		};

		// Render pagination
		const renderPagination = () => {
			const paginationContainer = document.getElementById('paginationContainer');
			const totalPages = Math.ceil(totalJobs / jobsPerPage);

			if (totalPages <= 1) {
				paginationContainer.innerHTML = '';
				return;
			}

			let paginationHTML = '';

			// Previous button
			if (currentPage > 0) {
				paginationHTML += `
			< button class="px-4 py-2 rounded-lg border transition-colors hover:bg-white/5" style = "border-color: var(--border-color); color: var(--text-main);" onclick = "loadJobs(${currentPage - 1})" >
				Previous
                    </button >
			`;
			}

			// Page info
			paginationHTML += `
			< span class="px-4 py-2" style = "color: var(--text-muted);" >
				Page ${currentPage + 1} of ${totalPages}
                </span >
			`;

			// Next button
			if (currentPage < totalPages - 1) {
				paginationHTML += `
			< button class="px-4 py-2 rounded-lg border transition-colors hover:bg-white/5" style = "border-color: var(--border-color); color: var(--text-main);" onclick = "loadJobs(${currentPage + 1})" >
				Next
                    </button >
                `;
			}

			paginationContainer.innerHTML = paginationHTML;
		};

		// Apply filters
		const applyFilters = () => {
			const searchInput = document.getElementById('searchInput').value.trim();
			const jobType = document.getElementById('jobTypeFilter').value;
			const location = document.getElementById('locationFilter').value.trim();

			currentFilters = {};
			currentSearchTerm = searchInput || null;

			if (jobType) currentFilters.job_type = jobType;
			if (location) currentFilters.location = location;

			loadJobs(0);
		};

		// Event listeners
		document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
		document.getElementById('searchInput').addEventListener('keypress', (e) => {
			if (e.key === 'Enter') applyFilters();
		});

		// Initialize
		document.addEventListener('DOMContentLoaded', () => {
			loadJobs(0);
		});
	</script>
</body>

</html>
