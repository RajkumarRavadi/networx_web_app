<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Signup - NETWORX</title>

	<!-- Tailwind -->
	<script src="https://cdn.tailwindcss.com"></script>

	<!-- Icons -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

	<!-- Custom Theme -->
	<link rel="stylesheet" href="/assets/networx_web_app/css/networx_theme.css">
</head>

<body class="flex items-center justify-center min-h-screen p-4">

	<div class="w-full max-w-md">
		<!-- Logo -->
		<div class="text-center mb-8">
			<div
				class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 shadow-lg shadow-violet-500/30 mb-4">
				<span class="text-3xl font-bold text-white">N</span>
			</div>
			<h1 class="text-3xl font-bold mb-1" style="color: var(--text-main);">NETWORX</h1>
			<p style="color: var(--text-muted);">Create your Student Account</p>
		</div>

		<!-- Signup Card -->
		<div class="glass-panel rounded-2xl p-8 shadow-xl">
			<div id="errorMessage"
				class="hidden bg-red-500/10 text-red-500 p-3 rounded-lg mb-4 text-sm border border-red-500/20"></div>
			<div id="successMessage"
				class="hidden bg-emerald-500/10 text-emerald-500 p-3 rounded-lg mb-4 text-sm border border-emerald-500/20">
			</div>

			<form id="signupForm" class="space-y-5">
				<div>
					<label class="block text-sm font-medium mb-2" style="color: var(--text-main);">Full Name</label>
					<div class="relative">
						<i class="ri-user-line absolute left-3 top-3 text-gray-400"></i>
						<input type="text" name="full_name"
							class="w-full pl-10 pr-4 py-3 rounded-lg form-input transition-all"
							placeholder="Enter your full name" required>
					</div>
				</div>

				<div>
					<label class="block text-sm font-medium mb-2" style="color: var(--text-main);">Email Address</label>
					<div class="relative">
						<i class="ri-mail-line absolute left-3 top-3 text-gray-400"></i>
						<input type="email" name="email"
							class="w-full pl-10 pr-4 py-3 rounded-lg form-input transition-all"
							placeholder="Enter your email" required autocomplete="email">
					</div>
				</div>

				<div>
					<label class="block text-sm font-medium mb-2" style="color: var(--text-main);">Password</label>
					<div class="relative">
						<i class="ri-lock-line absolute left-3 top-3 text-gray-400"></i>
						<input type="password" name="password"
							class="w-full pl-10 pr-4 py-3 rounded-lg form-input transition-all"
							placeholder="Create a password" required autocomplete="new-password" minlength="6">
					</div>
				</div>

				<button type="submit"
					class="w-full py-3 rounded-lg btn-primary font-bold text-lg shadow-lg shadow-violet-500/20">
					Sign Up
				</button>
			</form>

			<div class="text-center mt-6 text-sm" style="color: var(--text-muted);">
				Already have an account? <a href="/login" class="font-medium hover:underline"
					style="color: var(--primary);">Sign In</a>
			</div>
		</div>

		<!-- Theme Toggle (Floating) -->
		<button id="themeToggleBtn"
			class="fixed bottom-6 right-6 w-12 h-12 rounded-full glass-panel flex items-center justify-center shadow-lg transition-transform hover:scale-110"
			style="color: var(--text-main);">
			<i class="ri-moon-line text-xl"></i>
		</button>
	</div>

	<!-- Scripts -->
	<script src="/assets/networx_web_app/js/api.js"></script>
	<script src="/assets/networx_web_app/js/theme_toggle.js"></script>
	<script>
		document.getElementById('signupForm').addEventListener('submit', async (e) => {
			e.preventDefault();

			const errorDiv = document.getElementById('errorMessage');
			const successDiv = document.getElementById('successMessage');
			const submitBtn = e.target.querySelector('button[type="submit"]');

			// Hide messages
			errorDiv.classList.add('hidden');
			successDiv.classList.add('hidden');

			// Get form data
			const formData = new FormData(e.target);
			const fullName = formData.get('full_name');
			const email = formData.get('email');
			const password = formData.get('password');

			// Basic validation
			if (password.length < 6) {
				errorDiv.textContent = 'Password must be at least 6 characters.';
				errorDiv.classList.remove('hidden');
				return;
			}

			// Disable button
			submitBtn.disabled = true;
			submitBtn.innerHTML = '<i class="ri-loader-4-line animate-spin"></i> Creating Account...';

			try {
				// Call custom signup API directly using fetch
				const response = await fetch('/api/method/networx_web_app.networx_web_app.api.signup', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'Accept': 'application/json'
					},
					body: JSON.stringify({
						full_name: fullName,
						email: email,
						password: password
					})
				});

				const data = await response.json();

				if (response.ok && data.message && (data.message.success || data.message === 'Logged In')) {
					const result = data.message;
					// Success
					successDiv.textContent = (result.message || 'Account created!') + ' Redirecting...';
					successDiv.classList.remove('hidden');

					// Redirect to dashboard
					setTimeout(() => {
						window.location.href = '/dashboard';
					}, 1500);
				} else {
					// Error
					const errorMessage = data._server_messages ? 
						JSON.parse(JSON.parse(data._server_messages)[0]).message : 
						(data.message || 'Signup failed. Please try again.');
					
					errorDiv.textContent = errorMessage;
					errorDiv.classList.remove('hidden');
					submitBtn.disabled = false;
					submitBtn.textContent = 'Sign Up';
				}
			} catch (error) {
				console.error('Signup error:', error);
				errorDiv.textContent = 'An error occurred during signup. Please try again.';
				errorDiv.classList.remove('hidden');
				submitBtn.disabled = false;
				submitBtn.textContent = 'Sign Up';
			}
		});
	</script>
</body>

</html>
