<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Profile - NETWORX</title>

	<!-- Tailwind -->
	<script src="https://cdn.tailwindcss.com"></script>

	<!-- Icons -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

	<!-- Custom Theme -->
	<link rel="stylesheet" href="/assets/networx_web_app/css/networx_theme.css">

	<style>
		/* Profile Specific Overrides */
		.profile-cover {
			background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
			height: 200px;
			border-radius: 1rem 1rem 0 0;
			position: relative;
			overflow: hidden;
		}

		.profile-avatar {
			width: 160px;
			height: 160px;
			border: 4px solid var(--bg-card);
			background: var(--bg-body);
			box-shadow: var(--glass-shadow);
		}

		/* Motivational Quotes Background */
		.quote-background {
			position: absolute;
			width: 100%;
			height: 100%;
			top: 0;
			left: 0;
			pointer-events: none;
			overflow: hidden;
			z-index: 1;
			display: flex;
			align-items: center;
			justify-content: flex-end;
			padding-right: 2rem;
		}

		.quote-item {
			position: relative;
			font-size: 1.8rem;
			font-weight: 700;
			color: rgba(255, 255, 255, 0.6);
			text-align: right;
			max-width: 50%;
			text-shadow: 0 2px 20px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 255, 255, 0.2);
			z-index: 1;
			letter-spacing: 0.5px;
			line-height: 1.4;
			padding: 1rem;
		}

		/* Responsive quotes */
		@media (max-width: 768px) {
			.quote-background {
				padding-right: 1rem;
			}
			.quote-item {
				font-size: 1.2rem;
				max-width: 60%;
				padding: 0.5rem;
			}
		}

		/* Responsive quotes */
		@media (max-width: 768px) {
			.quote-item {
				font-size: 0.9rem;
			}
			.quote-item:nth-child(1) { font-size: 0.8rem; }
			.quote-item:nth-child(2) { font-size: 0.9rem; }
			.quote-item:nth-child(3) { font-size: 0.85rem; }
			.quote-item:nth-child(4) { font-size: 0.75rem; }
			.quote-item:nth-child(5) { font-size: 1rem; }
		}

		/* Quill Editor Dark Mode Fixes */
		[data-theme="dark"] .ql-editor {
			color: var(--text-main);
		}

		[data-theme="dark"] .ql-toolbar {
			background: white;
		}
	</style>
</head>

<body class="flex h-screen overflow-hidden">

	<!-- Sidebar -->
	{% set active_page = 'profile' %}
	{% include "networx_web_app/templates/includes/sidebar.html" %}

	<!-- Main Content -->
	<main class="flex-1 overflow-y-auto relative">
		<!-- Mobile Header -->
		<header class="md:hidden glass-panel sticky top-0 z-30 px-4 py-3 flex items-center justify-between">
			<a href="/dashboard" class="font-bold text-xl" style="color: var(--text-main);">NETWORX</a>
			<button class="p-2" style="color: var(--text-main);">
				<i class="ri-menu-line text-2xl"></i>
			</button>
		</header>

		<div class="p-6 md:p-10 max-w-7xl mx-auto pb-20">

			<!-- Loading State -->
			<div id="loadingState" class="flex justify-center py-20">
				<div class="loader"></div>
			</div>

			<!-- Profile Content -->
			<div id="profileContent" style="display: none;">

				<!-- Header Card -->
				<div class="glass-panel rounded-2xl mb-6 relative">
					<div class="profile-cover">
						<!-- Motivational Quotes Background -->
						<div class="quote-background">
							<!-- Quote will be inserted by JavaScript -->
						</div>
					</div>
					<div class="px-8 pb-8">
						<div class="relative -mt-20 mb-4">
							<div class="profile-avatar rounded-full flex items-center justify-center text-6xl font-bold overflow-hidden"
								id="profileAvatarContainer">
								<!-- Avatar Img or Initials -->
							</div>
						</div>

						<div class="flex flex-col md:flex-row justify-between items-start gap-4">
							<div>
								<h1 class="text-3xl font-bold mb-1" style="color: var(--text-main);" id="profileName">
									Loading...</h1>
								<p class="text-lg mb-4" style="color: var(--text-muted);" id="profileHeadline">
									Loading...</p>

								<div class="flex flex-wrap gap-4 text-sm" style="color: var(--text-muted);">
									<span class="flex items-center gap-1"><i class="ri-map-pin-line"></i> <span
											id="profileLocation">Location</span></span>
									<span class="flex items-center gap-1"><i class="ri-building-line"></i> <span
											id="profileCollege">College</span></span>
									<span class="flex items-center gap-1"><i class="ri-calendar-line"></i> Class of
										<span id="profileGradYear">Year</span></span>
								</div>
							</div>

							<div class="flex gap-3">
								<button class="px-6 py-2 rounded-full btn-primary font-medium flex items-center gap-2">
									<i class="ri-share-line"></i> Share
								</button>
								<button
									class="px-6 py-2 rounded-full border font-medium transition-colors hover:bg-white/5"
									style="border-color: var(--primary); color: var(--primary);">
									<i class="ri-download-line"></i> Resume
								</button>
							</div>
						</div>
					</div>
				</div>

				<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

					<!-- Left Column -->
					<div class="lg:col-span-2 space-y-6">

						<!-- About -->
						<div class="glass-panel rounded-2xl p-6" id="profileSummarySection">
							<div class="flex justify-between items-center mb-4">
								<h2 class="text-xl font-bold" style="color: var(--text-main);">About</h2>
								<button class="text-sm font-medium hover:underline flex items-center gap-1"
									style="color: var(--primary);" onclick="editSection('profileSummary')">
									<i class="ri-pencil-line"></i> Edit
								</button>
							</div>

							<div class="view-content prose prose-invert max-w-none" style="color: var(--text-main);">
								<div id="profileSummary"></div>
							</div>

							<div class="edit-form hidden" id="profileSummaryEdit">
								<textarea class="w-full p-3 rounded-lg form-input mb-4" rows="6"
									id="profileSummaryInput" placeholder="Tell us about yourself..."></textarea>
								<div class="flex gap-2">
									<button class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700"
										onclick="saveSection('profileSummary')">Save</button>
									<button class="px-4 py-2 rounded-lg border hover:bg-white/5"
										style="border-color: var(--border-color); color: var(--text-main);"
										onclick="cancelEdit('profileSummary')">Cancel</button>
								</div>
							</div>
						</div>

						<!-- Experience -->
						<div class="glass-panel rounded-2xl p-6" id="experienceSection">
							<div class="flex justify-between items-center mb-6">
								<h2 class="text-xl font-bold" style="color: var(--text-main);">Experience</h2>
								<button class="text-sm font-medium hover:underline flex items-center gap-1"
									style="color: var(--primary);" onclick="editSection('experience')">
									<i class="ri-add-line"></i> Add
								</button>
							</div>

							<div class="view-content space-y-6" id="experienceList"></div>

							<div class="edit-form hidden" id="experienceEdit">
								<div id="experienceItemsEdit" class="space-y-4 mb-4"></div>
								<button
									class="w-full py-3 rounded-lg border border-dashed mb-4 hover:bg-white/5 transition-colors"
									style="border-color: var(--text-muted); color: var(--text-muted);"
									onclick="addExperienceItem()">
									+ Add Position
								</button>
								<div class="flex gap-2">
									<button class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700"
										onclick="saveSection('experience')">Save</button>
									<button class="px-4 py-2 rounded-lg border hover:bg-white/5"
										style="border-color: var(--border-color); color: var(--text-main);"
										onclick="cancelEdit('experience')">Cancel</button>
								</div>
							</div>
						</div>

						<!-- Education -->
						<div class="glass-panel rounded-2xl p-6" id="educationSection">
							<div class="flex justify-between items-center mb-6">
								<h2 class="text-xl font-bold" style="color: var(--text-main);">Education</h2>
								<button class="text-sm font-medium hover:underline flex items-center gap-1"
									style="color: var(--primary);" onclick="editSection('education')">
									<i class="ri-add-line"></i> Add
								</button>
							</div>

							<div class="view-content space-y-6" id="educationList"></div>

							<div class="edit-form hidden" id="educationEdit">
								<div id="educationItemsEdit" class="space-y-4 mb-4"></div>
								<button
									class="w-full py-3 rounded-lg border border-dashed mb-4 hover:bg-white/5 transition-colors"
									style="border-color: var(--text-muted); color: var(--text-muted);"
									onclick="addEducationItem()">
									+ Add Education
								</button>
								<div class="flex gap-2">
									<button class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700"
										onclick="saveSection('education')">Save</button>
									<button class="px-4 py-2 rounded-lg border hover:bg-white/5"
										style="border-color: var(--border-color); color: var(--text-main);"
										onclick="cancelEdit('education')">Cancel</button>
								</div>
							</div>
						</div>

					</div>

					<!-- Right Column -->
					<div class="space-y-6">

						<!-- Contact Info -->
						<div class="glass-panel rounded-2xl p-6" id="contactSection">
							<div class="flex justify-between items-center mb-4">
								<h2 class="text-lg font-bold" style="color: var(--text-main);">Contact Info</h2>
								<button class="text-sm font-medium hover:underline flex items-center gap-1"
									style="color: var(--primary);" onclick="editSection('contact')">
									<i class="ri-pencil-line"></i> Edit
								</button>
							</div>

							<div class="view-content space-y-3" id="contactList">
								<!-- Populated by JS -->
							</div>

							<div class="edit-form hidden" id="contactEdit">
								<!-- Contact form fields -->
								<div class="space-y-3 mb-4">
									<input type="text" class="w-full p-2 rounded form-input" placeholder="LinkedIn URL"
										id="linkedinInput">
									<input type="text" class="w-full p-2 rounded form-input" placeholder="GitHub URL"
										id="githubInput">
									<input type="text" class="w-full p-2 rounded form-input" placeholder="Portfolio URL"
										id="portfolioInput">
								</div>
								<div class="flex gap-2">
									<button class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700"
										onclick="saveSection('contact')">Save</button>
									<button class="px-4 py-2 rounded-lg border hover:bg-white/5"
										style="border-color: var(--border-color); color: var(--text-main);"
										onclick="cancelEdit('contact')">Cancel</button>
								</div>
							</div>
						</div>

						<!-- Skills -->
						<div class="glass-panel rounded-2xl p-6" id="skillsSection">
							<div class="flex justify-between items-center mb-4">
								<h2 class="text-lg font-bold" style="color: var(--text-main);">Skills</h2>
								<button class="text-sm font-medium hover:underline flex items-center gap-1"
									style="color: var(--primary);" onclick="editSection('skills')">
									<i class="ri-add-line"></i> Add
								</button>
							</div>

							<div class="view-content flex flex-wrap gap-2" id="skillsList"></div>

							<div class="edit-form hidden" id="skillsEdit">
								<div id="skillsItemsEdit" class="space-y-2 mb-4"></div>
								<button class="w-full py-2 rounded-lg border border-dashed mb-4 hover:bg-white/5"
									style="border-color: var(--text-muted); color: var(--text-muted);"
									onclick="addSkillItem()">
									+ Add Skill
								</button>
								<div class="flex gap-2">
									<button class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700"
										onclick="saveSection('skills')">Save</button>
									<button class="px-4 py-2 rounded-lg border hover:bg-white/5"
										style="border-color: var(--border-color); color: var(--text-main);"
										onclick="cancelEdit('skills')">Cancel</button>
								</div>
							</div>
						</div>

					</div>
				</div>

			</div>

		</div>
	</main>

	<!-- Scripts -->
	<script>
		// Simple frappe.call implementation
		window.frappe = {
			session: { user: 'Guest', user_fullname: 'Guest' },
			call: function (opts) {
				const params = new URLSearchParams();
				if (opts.args) {
					for (const [key, value] of Object.entries(opts.args)) {
						if (value === null || value === undefined) continue;
						if (typeof value === 'object' && Object.keys(value).length === 0) continue;
						if (value === '') continue;
						if (typeof value === 'object') {
							params.append(key, JSON.stringify(value));
						} else {
							params.append(key, value);
						}
					}
				}
				const url = '/api/method/' + opts.method + (params.toString() ? '?' + params.toString() : '');
				return fetch(url, {
					method: 'GET',
					headers: { 'Accept': 'application/json' },
					credentials: 'same-origin'
				})
					.then(response => {
						if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
						return response.json();
					})
					.then(data => {
						if (opts.callback) opts.callback(data);
						return data;
					});
			}
		};
	</script>
	<script src="/assets/networx_web_app/js/utils.js"></script>
	<script src="/assets/networx_web_app/js/api.js?v=4"></script>
	<script src="/assets/networx_web_app/js/theme_toggle.js"></script>

	<script>
		// Profile Data State
		let profileData = {};

		// Helper function to convert private file path to accessible URL
		const getFileUrl = (filePath) => {
			if (!filePath) return null;
			
			// If it's already a full URL, return as is
			if (filePath.startsWith('http://') || filePath.startsWith('https://')) {
				return filePath;
			}
			
			// If it's a private file, use Frappe's file serving endpoint
			if (filePath.startsWith('/private/files/')) {
				// Encode the file path for the API
				const encodedPath = encodeURIComponent(filePath);
				return `/api/method/frappe.handler.upload_file.get_file?file_url=${encodedPath}`;
			}
			
			// If it's a public file, return as is
			if (filePath.startsWith('/files/')) {
				return filePath;
			}
			
			// If it doesn't start with /, assume it's a filename in /files/
			if (!filePath.startsWith('/')) {
				return `/files/${filePath}`;
			}
			
			// Default: return as is
			return filePath;
		};

		// Logout
		document.getElementById('logoutBtn').addEventListener('click', async (e) => {
			e.preventDefault();
			await frappe.call({
				method: 'logout',
				callback: () => window.location.href = '/login'
			});
		});

		// Load Profile
		const loadProfile = async () => {
			try {
				const result = await NetworkxAPI.getUserProfileDetails();

				if (result) {
					profileData = result;
					console.log('Profile data loaded:', profileData);
					renderProfile();
					document.getElementById('loadingState').style.display = 'none';
					document.getElementById('profileContent').style.display = 'block';
				}
			} catch (error) {
				console.error('Error loading profile:', error);
				document.getElementById('loadingState').innerHTML = '<div class="text-red-400">Error loading profile. Please refresh.</div>';
			}
		};

		// Render Profile
		const renderProfile = () => {
			// Header
			document.getElementById('profileName').textContent = profileData.full_name || frappe.session.user_fullname || 'User';
			document.getElementById('profileHeadline').textContent = profileData.headline || 'Student';
			
			// Location
			const location = profileData.current_location || 'Not set';
			document.getElementById('profileLocation').textContent = location;
			
			// College - get from education array
			let college = 'Not set';
			if (profileData.education && profileData.education.length > 0) {
				college = profileData.education[0].school || profileData.education[0].institution || 'Not set';
			}
			document.getElementById('profileCollege').textContent = college;
			
			// Graduation Year - get from education array
			let gradYear = 'N/A';
			if (profileData.education && profileData.education.length > 0) {
				gradYear = profileData.education[0].end_year || profileData.education[0].graduation_year || 'N/A';
			}
			document.getElementById('profileGradYear').textContent = gradYear;

			// Avatar - use profile_image from API response
			const avatarContainer = document.getElementById('profileAvatarContainer');
			const profileImage = profileData.profile_image;
			
			if (profileImage) {
				const imageUrl = getFileUrl(profileImage);
				avatarContainer.innerHTML = `<img src="${imageUrl}" class="w-full h-full object-cover" alt="Profile Image" onerror="this.parentElement.innerHTML='<span style=\\'color: var(--primary);\\'>${(profileData.full_name || 'U').charAt(0).toUpperCase()}</span>'">`;
			} else {
				const initials = (profileData.full_name || 'U').charAt(0).toUpperCase();
				avatarContainer.innerHTML = `<span style="color: var(--primary);">${initials}</span>`;
			}

			// Summary - use profile_summary from API response
			const summary = profileData.profile_summary || '';
			const summaryElement = document.getElementById('profileSummary');
			
			if (!summary || summary.trim() === '') {
				summaryElement.innerHTML = '<div class="text-sm italic" style="color: var(--text-muted);">No summary added yet.</div>';
			} else {
				// Check if summary contains HTML
				if (summary.includes('<') || summary.includes('&lt;')) {
					summaryElement.innerHTML = summary;
				} else {
					summaryElement.textContent = summary;
				}
			}
			
			// Set input value for editing
			const summaryInput = document.getElementById('profileSummaryInput');
			if (summaryInput) {
				// Strip HTML tags for textarea
				const textOnly = summary ? summary.replace(/<[^>]*>/g, '').trim() : '';
				summaryInput.value = textOnly || '';
			}

			// Experience
			renderExperience();

			// Education
			renderEducation();

			// Skills
			renderSkills();

			// Contact
			renderContact();
		};

		// Render Helpers
		const renderExperience = () => {
			const list = document.getElementById('experienceList');
			const items = profileData.experience || [];

			if (items.length === 0) {
				list.innerHTML = '<div class="text-sm italic" style="color: var(--text-muted);">No experience added yet.</div>';
				return;
			}

			list.innerHTML = items.map(item => {
				const title = item.title || item.job_title || item.position || 'Untitled Position';
				const company = item.company_name || item.company || 'Unknown Company';
				const startDate = item.start_date || item.start || '';
				const endDate = item.end_date || item.end || (item.is_current ? 'Present' : '');
				const description = item.description || item.summary || '';
				const location = item.location || '';
				
				return `
					<div class="border-b pb-4 last:border-0 last:pb-0" style="border-color: var(--border-color);">
						<h3 class="font-bold text-lg" style="color: var(--text-main);">${title}</h3>
						<div class="text-sm font-medium" style="color: var(--text-main);">${company}${location ? ` • ${location}` : ''}</div>
						<div class="text-xs mb-2" style="color: var(--text-muted);">${startDate}${endDate ? ` - ${endDate}` : ''}</div>
						${description ? `<p class="text-sm mt-2" style="color: var(--text-main);">${description}</p>` : ''}
					</div>
				`;
			}).join('');
		};

		const renderEducation = () => {
			const list = document.getElementById('educationList');
			const items = profileData.education || [];

			if (items.length === 0) {
				list.innerHTML = '<div class="text-sm italic" style="color: var(--text-muted);">No education added yet.</div>';
				return;
			}

			list.innerHTML = items.map(item => {
				const school = item.school || item.institution || item.university || 'Unknown School';
				const degree = item.degree || item.field_of_study || '';
				const startYear = item.start_year || item.start || '';
				const endYear = item.end_year || item.end_year || item.graduation_year || '';
				const gpa = item.gpa || '';
				
				return `
					<div class="border-b pb-4 last:border-0 last:pb-0" style="border-color: var(--border-color);">
						<h3 class="font-bold text-lg" style="color: var(--text-main);">${school}</h3>
						${degree ? `<div class="text-sm font-medium" style="color: var(--text-main);">${degree}</div>` : ''}
						<div class="text-xs" style="color: var(--text-muted);">${startYear}${endYear ? ` - ${endYear}` : 'Present'}</div>
						${gpa ? `<div class="text-xs mt-1" style="color: var(--text-muted);">GPA: ${gpa}</div>` : ''}
					</div>
				`;
			}).join('');
		};

		const renderSkills = () => {
			const list = document.getElementById('skillsList');
			const items = profileData.skills || [];

			if (items.length === 0) {
				list.innerHTML = '<div class="text-sm italic" style="color: var(--text-muted);">No skills added yet.</div>';
				return;
			}

			list.innerHTML = items.map(item => {
				const skillName = item.skill_name || item.name || item.skill || '';
				if (!skillName) return '';
				
				return `
					<span class="px-3 py-1 rounded-full text-sm font-medium bg-violet-500/10 text-violet-400 border border-violet-500/20">
						${skillName}
					</span>
				`;
			}).filter(html => html).join('');
		};

		const renderContact = () => {
			const list = document.getElementById('contactList');
			const contactItems = profileData.contact_info_details || profileData.contact_info || [];

			if (contactItems.length === 0) {
				list.innerHTML = '<div class="text-sm italic" style="color: var(--text-muted);">No contact information added yet.</div>';
				// Clear inputs if they are tied to specific contact types
				const linkedinInput = document.getElementById('linkedinInput');
				const githubInput = document.getElementById('githubInput');
				if (linkedinInput) linkedinInput.value = '';
				if (githubInput) githubInput.value = '';
				return;
			}

			list.innerHTML = contactItems.map(item => {
				const type = item.type || item.contact_type || '';
				const value = item.value || item.contact_value || '';
				
				if (!value) return '';

				let iconClass = '';
				let href = value;
				let displayValue = value;

				// Determine icon and href based on type
				switch (type.toLowerCase()) {
					case 'linkedin':
						iconClass = 'ri-linkedin-box-fill';
						if (!href.startsWith('http')) href = `https://${href}`;
						break;
					case 'github':
						iconClass = 'ri-github-fill';
						if (!href.startsWith('http')) href = `https://${href}`;
						break;
					case 'email':
						iconClass = 'ri-mail-fill';
						href = `mailto:${value}`;
						break;
					case 'phone':
						iconClass = 'ri-phone-fill';
						href = `tel:${value}`;
						break;
					case 'website':
					case 'portfolio':
						iconClass = 'ri-global-line';
						if (!href.startsWith('http')) href = `https://${href}`;
						break;
					case 'twitter':
						iconClass = 'ri-twitter-fill';
						if (!href.startsWith('http')) href = `https://${href}`;
						break;
					default:
						iconClass = 'ri-link';
						if (!href.startsWith('http') && !href.startsWith('mailto:') && !href.startsWith('tel:')) {
							href = `https://${href}`;
						}
						break;
				}

				return `
					<div class="flex items-center gap-3">
						<i class="${iconClass} text-xl" style="color: ${type.toLowerCase() === 'linkedin' ? '#0077b5' : 'var(--text-main)'};"></i>
						<a href="${href || '#'}" class="text-sm hover:underline" style="color: var(--text-main);" target="_blank" rel="noopener noreferrer">${displayValue}</a>
					</div>
				`;
			}).filter(html => html).join('');

			// Populate edit form inputs based on existing contact info
			const linkedinItem = contactItems.find(item => (item.type || '').toLowerCase() === 'linkedin');
			const linkedinInput = document.getElementById('linkedinInput');
			if (linkedinInput) {
				linkedinInput.value = linkedinItem ? (linkedinItem.value || '') : '';
			}

			const githubItem = contactItems.find(item => (item.type || '').toLowerCase() === 'github');
			const githubInput = document.getElementById('githubInput');
			if (githubInput) {
				githubInput.value = githubItem ? (githubItem.value || '') : '';
			}
		};

		// Edit Logic
		window.editSection = (section) => {
			document.getElementById(`${section}Section`).querySelector('.view-content').classList.add('hidden');
			document.getElementById(`${section}Edit`).classList.remove('hidden');
		};

		window.cancelEdit = (section) => {
			document.getElementById(`${section}Section`).querySelector('.view-content').classList.remove('hidden');
			document.getElementById(`${section}Edit`).classList.add('hidden');
		};

		window.saveSection = async (section) => {
			// Simplified save logic - in real app would gather data and call API
			if (section === 'profileSummary') {
				profileData.bio = document.getElementById('profileSummaryInput').value;
			} else if (section === 'contact') {
				profileData.linkedin_url = document.getElementById('linkedinInput').value;
				profileData.github_url = document.getElementById('githubInput').value;
			}

			// Call API to update
			try {
				await NetworkxAPI.updateUserProfile(profileData);
				renderProfile();
				cancelEdit(section);
			} catch (error) {
				console.error('Error saving:', error);
				alert('Failed to save changes');
			}
		};

		// Motivational Quotes Array
		const motivationalQuotes = [
			"Education is the most powerful weapon",
			"Success is a journey, not a destination",
			"The future belongs to those who learn",
			"Dream big, work hard, stay focused",
			"Knowledge is power",
			"Invest in yourself, your career will thank you",
			"Every expert was once a beginner",
			"Learning never exhausts the mind",
			"Your limitation—it's only your imagination",
			"Push yourself, because no one else is going to do it for you",
			"Great things never come from comfort zones",
			"Success doesn't just find you, you have to go out and get it",
			"Think big, start small, act now",
			"The only way to do great work is to love what you do",
			"Don't stop when you're tired, stop when you're done",
			"Hard work beats talent when talent doesn't work hard",
			"Believe you can and you're halfway there",
			"Opportunities don't happen, you create them",
			"Excellence is not a skill, it's an attitude",
			"The way to get started is to quit talking and begin doing"
		];

		// Initialize Quotes
		const initializeQuotes = () => {
			// Wait a bit to ensure DOM is ready
			setTimeout(() => {
				const quoteContainer = document.querySelector('.quote-background');
				if (!quoteContainer) {
					console.log('Quote container not found');
					return;
				}

				// Clear existing quotes
				quoteContainer.innerHTML = '';

				// Select only 1 random quote
				const randomIndex = Math.floor(Math.random() * motivationalQuotes.length);
				const selectedQuote = motivationalQuotes[randomIndex];

				// Create single quote element
				const quoteElement = document.createElement('div');
				quoteElement.className = 'quote-item';
				quoteElement.textContent = `"${selectedQuote}"`;
				quoteContainer.appendChild(quoteElement);
			}, 100);
		};

		// Initialize
		document.addEventListener('DOMContentLoaded', () => {
			loadProfile();
			initializeQuotes();
		});
	</script>
</body>

</html>
